<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Natural Care — gentle skin and hair care products inspired by nature.">
  <title>Natural Care | Skin &amp; Hair Care</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .site-home {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #e8f7ef 0%, #fffaf0 100%);
    }
    .home-card {
      width: min(720px, 100%);
      padding: clamp(32px, 7vw, 72px);
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(34, 84, 63, 0.14);
    }
    .home-card h1 { color: #28664f; font-size: clamp(2.4rem, 7vw, 4.8rem); margin: 0 0 16px; }
    .home-card p { max-width: 560px; margin: 0 auto 28px; color: #52615a; font-size: 1.1rem; line-height: 1.7; }
    .home-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    .home-actions a { display: inline-block; padding: 13px 22px; border-radius: 10px; background: #4b9b82; color: #fff; font-weight: 700; text-decoration: none; }
    .home-actions a.secondary { background: #edf5f0; color: #28664f; }
    .home-actions a:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main class="site-home">
    <section class="home-card" aria-labelledby="welcome-title">
      <p class="tag" style="margin: 0 auto 18px;">NATURAL BEAUTY, EVERY DAY</p>
      <h1 id="welcome-title">Natural Care</h1>
      <p>Discover thoughtful skin and hair care products made to nourish, protect, and bring out your natural glow.</p>
      <nav class="home-actions" aria-label="Primary navigation">
        <a href="./digital.html">Explore the collection</a>
        <a class="secondary" href="./login.html">Sign in</a>
      </nav>
    </section>
  </main>
</body>
</html>
